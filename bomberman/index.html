<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Bomberman Toy Box</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div class="hud">
      <div class="hud__top">
        <div class="badge">
          <span class="badge__label">Bomberman Toy Box</span>
          <span class="badge__sub">13×11 · cozy · <a href="/bomber/docs/stage.svg" target="_blank">stage.svg</a></span>
        </div>
        <div id="timer" class="timer">1:30</div>
              </div>
      <div class="stats">
        <span id="stat-p1" class="stat stat--p1">YOU</span>
        <span id="stat-p2" class="stat stat--p2">CPU</span>
      </div>
      <div class="hint hint--keys">
        <div><b>WASD/Arrows + Space/Enter</b> — move + bomb</div>
        <div><b>R</b> restart when the round ends</div>
      </div>
      <div class="hint hint--touch">
        <div><b>Left thumb</b> — joystick to move · <b>💣 button</b> — drop bomb</div>
      </div>
      <div id="banner" class="banner hidden"></div>
    </div>
    <div class="touch-ui" aria-hidden="true">
      <div id="joy-zone"></div>
      <div id="joy-base"><div id="joy-knob"></div></div>
      <button type="button" id="btn-bomb" aria-label="drop bomb">💣</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
