<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bomberman Toy Box — 2P</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div class="hud">
      <div class="hud__top">
        <div class="badge">
          <span class="badge__label">Bomberman Toy Box</span>
          <span class="badge__sub">13×11 · cozy · <a href="/docs/stage.svg" target="_blank">stage.svg</a></span>
        </div>
        <div id="timer" class="timer">1:30</div>
        <div class="net"><span class="net__dot"></span><span id="net-value">solo</span></div>
      </div>
      <div class="stats">
        <span id="stat-p1" class="stat stat--p1">P1</span>
        <span id="stat-p2" class="stat stat--p2">P2</span>
      </div>
      <div class="hint">
        <div><b>WASD/Arrows + Space/Enter</b> — move + bomb (your slot auto-assigned P1/P2 online)</div>
        <div><b>?local2P</b> couch 2P · <b>?bot</b> practice · <b>R</b> restart when over · open 2 tabs to test online</div>
      </div>
      <div id="banner" class="banner hidden"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
